[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KorgPaManager"
version = "1.1.1"
description = "Write-capable Standard MIDI manager for Korg Pa style data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "KorgPaManager project"}]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.gui-scripts]
korg-pa-manager = "korg_pa_manager.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["korg_pa_manager*", "mido*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
